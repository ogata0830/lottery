<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選中...</title>
  <script>
    const weights = [
      { url: "https://sites.google.com/stylepick.cc/30-persent-off/%E6%8A%BD%E9%81%B8%E3%83%9C%E3%82%BF%E3%83%B3", weight: 5 },
      { url: "https://sites.google.com/stylepick.cc/10-persent-off/%E6%8A%BD%E9%81%B8%E3%83%9C%E3%82%BF%E3%83%B3/untitled-page", weight: 35 }
    ];

    window.onload = function () {
      let total = weights.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * total;

      for (let item of weights) {
        if (r < item.weight) {
          window.location.href = item.url;
          return;
        }
        r -= item.weight;
      }
    };
  </script>
</head>
<body>
  <p>抽選中…</p>
</body>
</html>
