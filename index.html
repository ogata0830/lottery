<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選中...</title>
  <script>
    const weights = [
      { url: "https://sites.google.com/stylepick.cc/30-persent-off/%E3%83%9B%E3%83%BC%E3%83%A0", weight: 5 },
      { url: "https://sites.google.com/stylepick.cc/10-persent-off/%E3%83%9B%E3%83%BC%E3%83%A0", weight: 35 }
    ];

    window.onload = function () {
      let total = weights.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * total;

      for (let item of weights) {
        if (r < item.weight) {
          window.location.href = item.url;
          return;
        }
        r -= item.weight;
      }
    };
  </script>
</head>
<body>
  <p>抽選中…</p>
</body>
</html>
